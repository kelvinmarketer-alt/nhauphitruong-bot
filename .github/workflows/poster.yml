name: heartbeat
on:
  schedule:
    - cron: "*/15 * * * *"   # mỗi 15 phút: đẩy bài đặt lịch tới hạn -> publish đúng giờ
  workflow_dispatch: {}

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Ping wp-cron
        env:
          SITE: https://nhauphitruong.com
        run: python poster.py
