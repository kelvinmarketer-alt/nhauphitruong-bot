name: poster
on:
  schedule:
    - cron: "*/30 * * * *"   # mỗi 30 phút
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Run poster
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python poster.py
      - name: Commit state if changed
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "npt-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: cap nhat bai da gui [skip ci]"
            git push
          else
            echo "state khong doi"
          fi
